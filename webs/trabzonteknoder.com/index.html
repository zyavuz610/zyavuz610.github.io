<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yapım Aşamasında</title>

<!-- Bootstrap CSS (CDN) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons (font, resim değil) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

<style>
  :root{
    --bg1:#0f0c29;
    --bg2:#302b63;
    --bg3:#24243e;
    --accent:#ff8a00;
    --accent2:#00e0ff;
  }

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
  }

  body{
    background:linear-gradient(-45deg, var(--bg1), var(--bg2), var(--bg3), var(--bg1));
    background-size:400% 400%;
    animation:gradientShift 12s ease infinite;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    position:relative;
  }

  @keyframes gradientShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  /* Arka planda süzülen dairecikler (canvas ile çizilecek) */
  #bgCanvas{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index:0;
  }

  .content{
    position:relative;
    z-index:2;
    text-align:center;
    padding:2rem;
  }

  .gear-wrap{
    font-size:4.5rem;
    color:var(--accent);
    margin-bottom:1.5rem;
    display:inline-block;
    animation:spin 4s linear infinite;
    filter:drop-shadow(0 0 15px rgba(255,138,0,.6));
  }

  @keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }

  h1{
    font-weight:800;
    font-size:2.6rem;
    letter-spacing:1px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:.5rem;
  }

  .subtitle{
    font-size:1.15rem;
    color:#d8d8f0;
    margin-bottom:2rem;
    min-height:1.6em;
  }

  .subtitle::after{
    content:'|';
    animation:blink 1s step-start infinite;
    color:var(--accent2);
  }

  @keyframes blink{
    50%{opacity:0;}
  }

  .progress{
    height:10px;
    background:rgba(255,255,255,.15);
    border-radius:50px;
    overflow:hidden;
    box-shadow:inset 0 0 6px rgba(0,0,0,.4);
  }

  .progress-bar{
    background:linear-gradient(90deg, var(--accent2), var(--accent));
    animation:loadBar 3.5s ease-in-out infinite;
    border-radius:50px;
  }

  @keyframes loadBar{
    0%{width:5%;}
    50%{width:85%;}
    100%{width:5%;}
  }

  .social a{
    color:#fff;
    font-size:1.4rem;
    margin:0 .6rem;
    transition:transform .25s ease, color .25s ease;
    display:inline-block;
  }

  .social a:hover{
    transform:translateY(-5px) scale(1.15);
    color:var(--accent2);
  }

  .fade-in{
    opacity:0;
    animation:fadeInUp 1s ease forwards;
  }
  .delay-1{animation-delay:.2s;}
  .delay-2{animation-delay:.5s;}
  .delay-3{animation-delay:.8s;}
  .delay-4{animation-delay:1.1s;}

  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(25px);}
    to{opacity:1; transform:translateY(0);}
  }

  .badge-soon{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    padding:.4rem 1rem;
    border-radius:50px;
    font-size:.85rem;
    letter-spacing:.5px;
    color:#cfcfe8;
  }

  footer-note{
    font-size:.8rem;
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="content">
  <div class="gear-wrap fade-in delay-1">
    <i class="bi bi-gear-fill"></i>
  </div>

  <h1 class="fade-in delay-2">Sitemiz Yapım Aşamasında</h1>
  <div class="subtitle fade-in delay-2" id="typedText"></div>

  <div class="progress mx-auto mb-4 fade-in delay-3" style="max-width:360px;">
    <div class="progress-bar" role="progressbar"></div>
  </div>

  <p class="badge-soon fade-in delay-3 mb-4 d-inline-block">
    <i class="bi bi-clock-history me-1"></i> Çok yakında sizlerle
  </p>

  <div class="social fade-in delay-4">
    <a href="#" title="Instagram"><i class="bi bi-instagram"></i></a>
    <a href="#" title="Twitter / X"><i class="bi bi-twitter-x"></i></a>
    <a href="#" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
    <a href="#" title="E-posta"><i class="bi bi-envelope-fill"></i></a>
  </div>
</div>

<!-- Bootstrap JS (opsiyonel, gerekmiyor ama dursun) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

<script>
  // Daktilo efekti
  const messages = [
    "Yeni ve daha iyi bir deneyim hazırlıyoruz...",
    "Detaylarla uğraşıyoruz, biraz sabır...",
    "Çok yakında burada olacağız!"
  ];
  let msgIndex = 0, charIndex = 0, deleting = false;
  const typedEl = document.getElementById('typedText');

  function typeLoop(){
    const current = messages[msgIndex];
    if(!deleting){
      charIndex++;
      typedEl.textContent = current.substring(0, charIndex);
      if(charIndex === current.length){
        deleting = true;
        setTimeout(typeLoop, 1500);
        return;
      }
    } else {
      charIndex--;
      typedEl.textContent = current.substring(0, charIndex);
      if(charIndex === 0){
        deleting = false;
        msgIndex = (msgIndex + 1) % messages.length;
      }
    }
    setTimeout(typeLoop, deleting ? 35 : 55);
  }
  typeLoop();

  // Arka planda süzülen parçacıklar
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const colors = ['rgba(255,138,0,', 'rgba(0,224,255,', 'rgba(255,255,255,'];

  function createParticles(count){
    particles = [];
    for(let i=0;i<count;i++){
      particles.push({
        x: Math.random()*w,
        y: Math.random()*h,
        r: Math.random()*3 + 1,
        dx: (Math.random()-0.5)*0.4,
        dy: (Math.random()-0.5)*0.4,
        color: colors[Math.floor(Math.random()*colors.length)],
        alpha: Math.random()*0.5 + 0.2
      });
    }
  }
  createParticles(70);

  function animate(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(p=>{
      p.x += p.dx;
      p.y += p.dy;
      if(p.x < 0 || p.x > w) p.dx *= -1;
      if(p.y < 0 || p.y > h) p.dy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color + p.alpha + ')';
      ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
</script>

</body>
</html>
